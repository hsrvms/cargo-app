name: Deploy Cargo (prod)

on:
  push:
    branches:
      - main

env:
  # Genel
  AWS_REGION: ca-central-1
  ECR_REGISTRY: 954222311757.dkr.ecr.ca-central-1.amazonaws.com
  ECR_REPOSITORY: cargoapp_main
  IMAGE_TAG: latest

  # EC2
  EC2_HOST: ${{ secrets.EC2_IP_CARGO_CA }}
  EC2_USER: ubuntu
  EC2_APP_PATH: /home/ubuntu/cargo-app

  # Telegram


jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cargo_main

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Generate image tag
        id: image_tag
        run: |
          IMAGE_TAG="v1.0.0-$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}"
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "Generated tag: $IMAGE_TAG"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_CARGO }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_CARGO }}
          aws-region: ca-central-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          echo "🔨 Building image: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
          docker build --no-cache \
          -f Dockerfile.prod \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .

      - name: Push Docker image to ECR
        run: |
          echo "📤 Pushing tagged image..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          echo "📤 Pushing latest tag..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY_CARGO_CA }}" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem

      - name: Deploy on EC2
        env:
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
        run: |
          ssh -i ~/.ssh/ec2.pem -o StrictHostKeyChecking=no \
          $EC2_USER@$EC2_HOST << EOF
            set -e
            cd $EC2_APP_PATH
            git pull
            
            echo "🔐 Logging into ECR..."
            aws ecr get-login-password --region ca-central-1 | \
              docker login --username AWS --password-stdin $ECR_REGISTRY
            
            echo "📝 Updating .env with new image tag..."
            echo "IMAGE_TAG=$IMAGE_TAG" > .env.image
            
            echo "🗑️ Stopping old container..."
            docker compose -f docker-compose-prod.yml down || true

            
            echo "📥 Pulling new image: $IMAGE_TAG"
            export IMAGE_TAG=$IMAGE_TAG
            docker compose -f docker-compose-prod.yml pull app

            
            echo "🚀 Starting new container..."
            docker compose -f docker-compose-prod.yml up -d app
            
            echo "⏳ Waiting for container to be healthy..."
            sleep 5
            
            echo "✅ Deployment complete!"
            docker ps | grep app
            docker logs cargo-app-app-1  --tail 20
          EOF

      - name: Cleanup local images
        if: always()
        run: |
          docker rmi $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG || true
          docker rmi $ECR_REGISTRY/$ECR_REPOSITORY:latest || true
      - name: Deployment summary
        run: |
          echo "### Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tag:** \`$IMAGE_TAG\`" >> $GITHUB_STEP_SUMMARY
          echo "- **ECR Repository:** \`$ECR_REPOSITORY\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed to:** \`$EC2_HOST\`" >> $GITHUB_STEP_SUMMARY