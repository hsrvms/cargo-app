services:
    app:
        # CHANGE 1: For local testing, use the name we will build below.
        # For actual prod, uncomment the ECR line.
        image: cargo-prod-test:latest
        # image: 954222311757.dkr.ecr.ca-central-1.amazonaws.com/cargoapp_main:${IMAGE_TAG}

        # pull_policy: always  <-- Disable this for local testing so it finds your local image

        ports:
            - "8080:8080"

        # CHANGE 2: REMOVE VOLUMES
        # Do NOT mount source code in prod. The binary is already inside.
        # volumes:
        #   - .:/app

        env_file:
            - .env
            # - .env.image # You likely don't have this locally, so comment it out for test

        environment:
            # CHANGE 3: DB HOST
            # Ensure your .env uses "db" as the host, OR override it here:
            - DB_HOST=db
            - DB_PORT=5432
            # GOCACHE is not needed in prod

        depends_on:
            - db

        # CHANGE 4: USE DEFAULT COMMAND
        # We want the Dockerfile's CMD ["./main"] to run.
        # command: ["sh", "-c", "sleep 5 && air -c .air.toml"]

        # CHANGE 5: REMOVE USER
        # The 'alpine' image might not know your host UID. Let it run as root (default)
        # or create a user inside the Dockerfile.
        # user: "${UID}:${GID}"

        restart: unless-stopped

    db:
        image: postgres:14-alpine
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=go-starter
        ports:
            - "5432:5432"
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
