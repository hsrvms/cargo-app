services:
    app:
        image: 954222311757.dkr.ecr.ca-central-1.amazonaws.com/cargoapp_main:${IMAGE_TAG}
        pull_policy: always

        ports:
            - "8080:8080"

        env_file:
            - .env

        environment:
            - APP_ENV=production
            - DB_HOST=db
            - DB_PORT=5432
            - GODEBUG=netdns=go

        depends_on:
            - db

        restart: unless-stopped

    db:
        image: postgres:14-alpine
        volumes:
            - postgres_data:/var/lib/postgresql/data/
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=go-starter
        ports:
            - "5432:5432"
        restart: unless-stopped
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
    postgres_data:
